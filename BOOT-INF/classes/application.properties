# ===================================================================
# Secure File Exchange Portal - Application Configuration
# ===================================================================

# Server Port & Network Binding
server.port=8080
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Application Name
spring.application.name=secure-file-exchange

# Public Base URL for Share Links (Configurable via PUBLIC_BASE_URL env var)
# If left empty, frontend dynamically resolves current origin (window.location.origin)
app.public-base-url=${PUBLIC_BASE_URL:}

# MySQL Datasource Configuration (Configured via Environment Variables)
# Sensitive values default to local development fallbacks if not provided in env.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/secure_file_share?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Dheep@485516}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload Size Limits (Encrypted Ciphertext + Multipart metadata)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE_MB:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE_MB:55MB}

# Storage Configuration
# Files are stored outside the web root / static directories.
app.storage.upload-dir=${STORAGE_DIR:./storage/uploads}
app.storage.max-file-size-bytes=${MAX_FILE_SIZE_BYTES:52428800}

# Logging configuration - Ensure sensitive parameters (keys, tokens) are never logged
logging.level.org.springframework.web=INFO
logging.level.com.college.securefile=INFO
